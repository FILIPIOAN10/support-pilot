<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SupportPilot - flashcard-uri</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1b2230; --muted:#5a6475; --line:#dde1e8; --accent:#2457d6; --accent-text:#fff; --ok:#12755a; --bad:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151b; --card:#1b2029; --text:#e8ebf1; --muted:#9aa4b5; --line:#2c3442; --accent:#7aa2ff; --accent-text:#0e1420; --ok:#4cc39c; --bad:#ff8a80; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.55 system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  h1 { font-size:1.3rem; margin:8px 0 4px; }
  .muted { color:var(--muted); font-size:.9rem; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
  button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.on { background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
  button.ok { color:var(--ok); } button.no { color:var(--bad); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; min-height:260px; padding:24px; cursor:pointer; display:flex; flex-direction:column; justify-content:center; }
  .tag { font-size:.8rem; color:var(--muted); margin-bottom:10px; }
  .text { white-space:pre-wrap; font-size:1.15rem; }
  .back .text { font-size:1.05rem; }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; align-items:center; }
  .grow { flex:1; }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin-top:6px; }
  .bar > div { height:100%; background:var(--ok); width:0; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<main>
  <h1>SupportPilot: flashcard-uri pentru interviu</h1>
  <p class="muted">Citește întrebarea, răspunde cu voce tare, abia apoi întoarce cartea. Taste: <b>Spațiu</b> întoarce, <b>J</b> = știam, <b>N</b> = încă nu. Pentru interviu: alege <b>Explică proiectul (RO)</b> sau <b>Explain it (EN)</b> — cărțile vin în ordinea poveștii.</p>
  <div class="chips" id="decks"></div>
  <div class="row">
    <span id="counter" class="muted"></span><span class="grow"></span>
    <button id="onlyUnknown" type="button">Doar ce nu știu</button>
    <button id="shuffle" type="button">Amestecă</button>
    <button id="reset" type="button">Șterge progresul</button>
  </div>
  <div class="bar" aria-hidden="true"><div id="progress"></div></div>
  <p id="score" class="muted"></p>
  <div id="card" class="card" role="button" tabindex="0" aria-label="Întoarce cartea"></div>
  <div class="row">
    <button id="no" type="button" class="no">Încă nu (N)</button>
    <button id="ok" type="button" class="ok">Știam (J)</button>
    <span class="grow"></span>
    <button id="prev" type="button">Înapoi</button>
    <button id="next" type="button">Următoarea</button>
  </div>
</main>

<script>
"use strict";
const CARDS = [
  { c: "Concepte", q: "Ce face SupportPilot, într-o frază?", a: "Un agent de suport care caută singur comenzi și politici, dar pentru orice rambursare așteaptă aprobarea unui om; aprobarea rezistă și la un restart." },
  { c: "Concepte", q: "Ce e un agent? Cum diferă de lanțul din DocuAsk?", a: "Un model de limbaj într-o buclă cu unelte: modelul alege unealta și argumentele, codul o rulează, rezultatul se întoarce la model, până răspunde sau atinge o limită.\nDocuAsk e un lanț fix (caută → prompt → model → verificare), mereu în aceeași ordine." },
  { c: "Concepte", q: "Ce e tool calling?", a: "Modelul primește descrierea uneltelor și poate răspunde cu „apelează get_order cu order_id=1002”. Modelul nu rulează nimic: codul tău rulează unealta." },
  { c: "Concepte", q: "Ce e un checkpointer și ce face MongoDBSaver?", a: "Locul unde LangGraph salvează starea grafului după fiecare pas, sub un thread_id (la mine = id-ul conversației). MongoDBSaver o salvează în MongoDB, deci orice proces o poate relua." },
  { c: "Concepte", q: "Ce e un interrupt și cum se reia?", a: "O pauză a grafului care așteaptă o decizie din afară. Se reia cu Command(resume={\"decisions\": [{\"type\": \"approve\"}]}) pe același thread_id. result.interrupts apare doar cu invoke(..., version=\"v2\")." },
  { c: "Concepte", q: "Care sunt cele 4 unelte?", a: "get_order(order_id)\nsearch_policies(question) → DocuAsk\ncheck_refund_eligibility(order_id)\nrequest_refund(order_id, reason) → pauză pentru om" },
  { c: "Concepte", q: "Care sunt cele 4 middleware-uri?", a: "PIIMiddleware(\"email\", redact): e-mailurile nu ajung la model.\nModelCallLimitMiddleware(6).\nToolCallLimitMiddleware(5).\nHumanInTheLoopMiddleware: pauză înainte de request_refund (approve / reject)." },
  { c: "Securitate", q: "De ce customer_id NU e argument al uneltelor?", a: "Ca un model păcălit să nu poată cere comenzile altcuiva (IDOR). Identitatea vine din cererea autentificată, prin config[\"configurable\"][\"customer_id\"]; modelul vede doar order_id." },
  { c: "Securitate", q: "De ce „nu există” și „nu e a ta” au același răspuns?", a: "Ca să nu confirmi că un număr de comandă există. La fel la conversații: a altuia dă 404, nu 403." },
  { c: "Securitate", q: "De ce request_refund reverifică eligibilitatea?", a: "Regulile stau în cod, nu în prompt: modelul poate sări pasul, iar comanda se poate schimba cât așteaptă aprobarea. Verificarea care contează rulează când rulează acțiunea, după aprobare." },
  { c: "Securitate", q: "Doi admini apasă „aprobă” în aceeași secundă. Ce se întâmplă?", a: "claim_approval face find_one_and_update atomic (pending → deciding): unul primește documentul, celălalt None → 404. Plus Idempotency-Key = thread_id:order_id la sistemul de comenzi. Rezultat: o singură rambursare." },
  { c: "Securitate", q: "Ce se întâmplă dacă reluarea după aprobare eșuează?", a: "release_approval pune aprobarea înapoi în pending, ca decizia să poată fi reîncercată, în loc să rămână blocată în deciding." },
  { c: "Securitate", q: "Ce face promptul de sistem și ce NU garantează?", a: "Spune ce unealtă pentru ce, să nu afirme nimic din memorie, să zică „trimis spre aprobare” și să trateze textul din unelte și din mesaj ca date. Ghidează, dar nu garantează: garanțiile sunt în cod (unelte, limite, aprobare)." },
  { c: "Integrare", q: "Ce se reîncearcă și ce nu?", a: "Da: 5xx, 429, erori de rețea (3 încercări, backoff ~0,2 / 0,4 / 0,8 s + jitter).\nNu: 404 (răspuns de business) și alte 4xx (greșeala mea, ex. cheie greșită)." },
  { c: "Integrare", q: "Circuit breaker: cele trei stări", a: "Closed: apelurile trec.\nOpen (după 5 eșecuri la rând): eșuezi imediat, fără apel, 30 s.\nHalf-open: un singur apel de probă; reușit → closed, eșuat → open încă 30 s." },
  { c: "Integrare", q: "De ce 404 nu deschide breaker-ul?", a: "Serviciul a răspuns corect: lucrul cerut nu există. Nu e un eșec al serviciului, deci record_success()." },
  { c: "Integrare", q: "De ce jitter la backoff?", a: "Ca mulți clienți să nu reîncerce în aceeași milisecundă și să lovească din nou un serviciu abia repornit (thundering herd)." },
  { c: "Integrare", q: "De ce e periculos retry-ul pe un POST?", a: "Dacă nu e idempotent, repetă efectul: două rambursări. Remediu: Idempotency-Key; aceeași cheie întoarce aceeași rambursare." },
  { c: "Integrare", q: "De ce un breaker separat pentru fiecare serviciu?", a: "Dacă pică DocuAsk, comenzile trebuie să meargă în continuare. Un breaker comun le-ar opri pe toate." },
  { c: "Integrare", q: "Ce face agentul când sistemul de comenzi e căzut?", a: "Unealta prinde ServiceUnavailable și întoarce text („sistemul e indisponibil, încearcă mai târziu”); agentul răspunde politicos, nu cade și nu inventează o stare." },
  { c: "Date", q: "De ce MongoDB aici și Postgres în Proiectul 1?", a: "O conversație e un document întreg, cu formă care se schimbă, fără JOIN-uri; LangGraph are checkpointer pentru Mongo. În DocuAsk contează integritatea documente ↔ bucăți și vectorii." },
  { c: "Date", q: "De ce un script Lua pentru rate limit?", a: "INCR + EXPIRE într-un singur pas atomic: nu se strecoară alt client între ele și nu rămâne un contor fără expirare (care ar bloca un client pe vecie)." },
  { c: "Date", q: "Ce înseamnă fail-open la rate limit?", a: "Dacă Redis cade, cererea trece: un limitator stricat nu trebuie să devină avarie. Plafonul de cost rămâne în limitele agentului (6 / 5). Clientul Redis are timeout 0,3 s." },
  { c: "Date", q: "Cum se vede costul?", a: "Tokenii se colectează cu get_usage_metadata_callback la fiecare rulare și se adună pe conversație în Mongo cu $inc (atomic)." },
  { c: "Cifre", q: "6 / 5", a: "Maximum 6 apeluri de model și 5 apeluri de unelte pe o rulare a agentului." },
  { c: "Cifre", q: "2 s / 8 s / 28 s", a: "Timeout de conectare / de citire spre servicii externe / de citire spre DocuAsk (8 + 20, un răspuns LLM e lent; doar 2 încercări)." },
  { c: "Cifre", q: "5 / 30 s / 1", a: "Breaker-ul se deschide după 5 eșecuri la rând, stă deschis 30 s, apoi lasă 1 apel de probă." },
  { c: "Cifre", q: "30 de zile, 20 pe minut", a: "Fereastra de rambursare de la livrare; limita de mesaje pe client pe minut." },
  { c: "Cifre", q: "Porturile", a: "API 8001, comenzi (simulat) 9000, MongoDB 27018, Redis 6380, DocuAsk 8000." },
  { c: "Interviu (EN)", q: "Walk me through SupportPilot.", a: "I built SupportPilot, a customer-support agent on LangChain and LangGraph. It chooses its own tools: it looks up orders, answers policy questions through my RAG service, and checks whether an order can be refunded. The refund itself pauses and waits for a human, and because the agent's state is checkpointed in MongoDB, the approval works even after a restart. External calls have timeouts, retries and a circuit breaker, and customers are rate-limited with Redis." },
  { c: "Interviu (EN)", q: "How do you stop the agent from doing damage?", a: "Least privilege: identity comes from the request, not the model; the rules are in the tools; calls are capped; and the only tool that moves money waits for a human, with an atomic claim and an idempotency key." },
  { c: "Interviu (EN)", q: "How do you handle prompt injection?", a: "I assume it will happen. The model has no identity parameter, the tools enforce ownership and the refund rules, the run is capped, and the side effect needs a human. The prompt marks tool output and user text as data, but that's guidance, not a control." },
  { c: "Interviu (EN)", q: "How do you know a real model picks the right tools?", a: "With a small evaluation: 10 messages with the exact expected tool sequence plus 3 manipulation attempts judged by effects (no refund, no foreign data). gpt-4o-mini: 10/10 and 3/3, ~880 tokens per case. The scripted model got 9/10, so the eval does catch mistakes. Small set, one run: a signal, not proof." },
  { c: "Interviu (EN)", q: "How does a slow dependency not take you down?", a: "Explicit connect and read timeouts, retries only on transient errors with backoff and jitter, and a circuit breaker per dependency that fails fast after five failures and probes once after 30 seconds." },
  { c: "Onestitate", q: "Ce NU face și ce NU ai verificat?", a: "Nu e în producție; aplicația din Docker a rulat cu modelul fals (modelul real doar în evaluarea de 13 cazuri); identitatea e un header de la gateway, nu un token semnat; fără streaming și tracing; rate limit cu fereastră fixă; ramura Azure netestată." },
  { c: "Explică proiectul (RO)", q: "1 · Ce problemă rezolvă?", a: "Un agent de suport care poate face lucruri, nu doar vorbi. Riscul: are acces la bani (rambursări) și un model de limbaj poate fi păcălit. Proiectul arată cum faci un agent pe care îl poți lăsa aproape de bani: drepturi minime, reguli în cod, limite, aprobare umană." },
  { c: "Explică proiectul (RO)", q: "2 · Ce face, în 30 de secunde?", a: "SupportPilot e un agent de suport pe LangChain și LangGraph. Alege singur unealta: caută comanda, caută în politici prin DocuAsk (RAG-ul meu), verifică dacă o comandă se poate rambursa. Rambursarea se oprește și așteaptă un om; pauza stă în MongoDB, deci merge și după restart. Apelurile externe au timeout, retry și circuit breaker; clienții sunt limitați cu Redis." },
  { c: "Explică proiectul (RO)", q: "3 · Ce desenezi pe tablă?", a: "De la stânga la dreapta:\nclient → API FastAPI (cheie + X-Customer-Id, rate limit Redis) → SupportService → agentul (create_agent + 4 middleware) → 4 unelte → sistemul de comenzi și DocuAsk.\nDedesubt: MongoDB (conversații, aprobări, checkpoint-uri) și Redis (contoare).\nLângă request_refund: o barieră „PAUZĂ → om”." },
  { c: "Explică proiectul (RO)", q: "4 · Drumul unei întrebări simple („Unde e comanda 1002?”)", a: "API: verifică cheia și clientul, rate limit → serviciul creează conversația în Mongo → agentul rulează cu customer_id în config → modelul cere get_order(1002) → unealta citește clientul din config, cere comanda, ascunde câmpurile interne → modelul scrie răspunsul → tokenii se adună pe conversație." },
  { c: "Explică proiectul (RO)", q: "5 · Rambursarea, până la pauză", a: "Modelul cere check_refund_eligibility (livrată? sub 30 de zile? a clientului?) → eligibilă → cere request_refund → HumanInTheLoopMiddleware oprește graful ÎNAINTE de unealtă → starea se salvează în MongoDB → serviciul salvează aprobarea cu argumentele exacte → clientul primește un mesaj fix: „trimis spre aprobare”. Nimic creat încă." },
  { c: "Explică proiectul (RO)", q: "6 · Rambursarea: aprobarea și reluarea", a: "Adminul vede lista cu argumentele exacte → aprobă → revendicare atomică (find_one_and_update pending → deciding) → Command(resume=approve) reia ACEEAȘI rulare din checkpoint → request_refund reverifică proprietarul și cele 30 de zile → creează rambursarea cu Idempotency-Key = conversație:comandă → audit: cine, ce, când. În loguri: GET comanda, apoi POST refund, sub același request id." },
  { c: "Explică proiectul (RO)", q: "7 · De ce e sigur? (cele 4 plase)", a: "1) Identitatea nu vine de la model: customer_id e în config, modelul vede doar order_id.\n2) Regulile stau în unelte și se reverifică la execuție.\n3) Limite: 6 apeluri de model, 5 de unelte, e-mailuri redactate.\n4) Un om în fața banilor: pauză reală + revendicare atomică + idempotență.\nTest: un model compromis cere comanda altcuiva, omul aprobă, unealta tot refuză." },
  { c: "Explică proiectul (RO)", q: "8 · Ce se întâmplă când pică sistemul de comenzi?", a: "Timeout explicit (2 s / 8 s), 3 încercări cu backoff și jitter → unealta întoarce text „indisponibil” → agentul răspunde politicos, fără stare inventată (~0,9 s). După 5 eșecuri breaker-ul se deschide: răspuns în 0,08 s, fără apel. După 30 s, un apel de probă îl închide. Măsurat în Docker cu /chaos fail." },
  { c: "Explică proiectul (RO)", q: "9 · Unde stau datele și de ce?", a: "MongoDB: conversații, aprobări, checkpoint-urile agentului — documente întregi, formă care se schimbă, fără JOIN, find_one_and_update atomic.\nRedis: contoare de rate limit, Lua INCR+EXPIRE, fail-open.\nPostgres + pgvector (DocuAsk): documentele și vectorii politicilor." },
  { c: "Explică proiectul (RO)", q: "10 · Cum ai testat?", a: "57 de teste, 95 % acoperire, CI verde. Unelte fără model; agentul cu model scriptat (inclusiv model compromis și model blocat în buclă); serviciul pe MongoDB și Redis reale (Testcontainers): restart în mijlocul aprobării, doi admini cu barieră → o rambursare; API prin HTTP; contract cu clasa reală ChatOpenAI contra unui server OpenAI local." },
  { c: "Explică proiectul (RO)", q: "11 · Cum ai măsurat modelul real?", a: "Scriptul evals/tool_choice.py: 10 mesaje cu secvența de unelte așteptată + 3 manipulări judecate după efecte (nicio rambursare, nicio dată străină). gpt-4o-mini: 10/10 și 3/3, ~880 tokeni pe caz. Modelul scriptat: 9/10, deci scriptul chiar prinde greșeli. Set mic, o rulare: semnal, nu dovadă." },
  { c: "Explică proiectul (RO)", q: "12 · Cum îl livrezi?", a: "Imagine Docker multi-stage, non-root (uid 10001), healthcheck, exec form, 356 MB. Compose cu Mongo, Redis, simulatorul de comenzi și API-ul, pornit doar când celelalte sunt healthy. CI pe GitHub Actions: lint + 57 de teste pe containere de serviciu, poartă 80 %, apoi build de imagine. Regulă pe main: CI-ul trebuie să treacă, fără force-push." },
  { c: "Explică proiectul (RO)", q: "13 · Ce ai găsit și reparat singur?", a: "1) Linia de log a cererii pierdea request id-ul (resetat prea devreme).\n2) Clientul Redis „căzut” din teste avea retry implicit: 5–6 s pe test (suita 30 s → 18 s).\n3) Simulatorul folosea healthcheck-ul imaginii pe portul greșit și apărea unhealthy.\nPlus: pe Windows, localhost costă ~2 s la conexiune nouă (IPv6 întâi)." },
  { c: "Explică proiectul (RO)", q: "14 · Limite și ce ai face mai departe", a: "Limite: identitatea e un header de gateway (real: JWT/OIDC); o singură acțiune cu pauză pe tură; fără streaming și tracing; fereastră fixă la rate limit; evaluare mică; aplicația cap-coadă a rulat cu modelul scriptat; Azure netestat.\nMai departe: token semnat, evaluare mai mare și repetată, tracing, sliding window." },
  { c: "Explică proiectul (RO)", q: "15 · Cum spui cinstit cum l-ai construit?", a: "Pas cu pas, după un plan scris, cu ajutorul unui asistent AI pentru explicații și verificare. Am scris și rulat fiecare pas, am un jurnal cu dovezi pentru fiecare, am găsit și reparat 3 greșeli din plan și am făcut pașii pe care planul nu-i verificase: CI pe GitHub și evaluarea cu modelul real. Pot explica orice fișier." },
  { c: "Explain it (EN)", q: "30-second pitch", a: "I built SupportPilot, a customer-support agent on LangChain and LangGraph. It picks its own tools: order lookup, policy questions through my RAG service, refund eligibility. The refund itself pauses for a human, and because the agent state is checkpointed in MongoDB, approval works even after a restart. External calls have timeouts, retries and a circuit breaker; customers are rate-limited with Redis." },
  { c: "Explain it (EN)", q: "Walk me through the architecture.", a: "A FastAPI layer authenticates the gateway key and the customer id and rate-limits in Redis. A service layer owns the use cases. The agent is create_agent with four middlewares around the loop. It has four tools that call the order system and my RAG service through clients with timeouts, retries and a breaker. MongoDB keeps conversations, approvals and the agent checkpoints." },
  { c: "Explain it (EN)", q: "Walk me through a refund.", a: "The model checks eligibility, then asks for request_refund. A human-in-the-loop middleware interrupts before the tool runs and the state is saved in MongoDB; the customer gets a fixed 'sent for approval' message. An admin sees the exact arguments and approves; the claim is atomic, the same run resumes, the tool re-checks the rules and creates the refund with an idempotency key." },
  { c: "Explain it (EN)", q: "Why is it safe with money?", a: "Least privilege: identity comes from the authenticated request, the model only sees an order id. The rules live in the tools and are re-checked at execution. Calls are capped and emails redacted. The one action with a side effect waits for a human. A test with a compromised model shows that even after a human approves, the tool still refuses another customer's order." },
  { c: "Explain it (EN)", q: "What happens when a dependency fails?", a: "Explicit timeouts, three retries with exponential backoff and jitter on transient errors only, and a circuit breaker per dependency. The tool turns the failure into text, so the agent answers politely. I measured it: about 0.9 seconds per answer, then after five failures the breaker opens and answers come in 80 milliseconds." },
  { c: "Explain it (EN)", q: "How did you test and measure it?", a: "57 tests at 95% coverage, green in CI, on real MongoDB and Redis: restart in the middle of an approval, two admins racing, the full HTTP story, and the real ChatOpenAI client against a local fake server. For the real model, a small tool-choice evaluation: gpt-4o-mini matched 10 of 10 sequences and stopped 3 of 3 manipulation attempts." },
  { c: "Explain it (EN)", q: "What did you find and fix?", a: "Three things beyond the plan: the access log lost the request id, a test client retried Redis by default and made the suite 40% slower, and a container reused a healthcheck on the wrong port and showed unhealthy. I also measured that on Windows, localhost costs about two seconds per new connection." },
  { c: "Explain it (EN)", q: "What are the limits?", a: "Identity is a trusted gateway header, not a signed token. One gated action per turn, no streaming, no tracing, a fixed-window rate limit. The evaluation is small and single-run, and the end-to-end flow ran with the scripted model. It's built and tested locally and in containers with CI, not in production." }
];

const KEY = "supportpilot-flashcards-v1";
let known = {};
try { known = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (_) { known = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(known)); } catch (_) { /* storage blocked */ } };

const $ = (id) => document.getElementById(id);
const decks = ["Toate", ...new Set(CARDS.map((c) => c.c))];
let deck = "Toate", onlyUnknown = false, order = [], pos = 0, flipped = false;

function buildOrder(shuffle) {
  order = CARDS.map((c, i) => i).filter((i) => (deck === "Toate" || CARDS[i].c === deck) && !(onlyUnknown && known[CARDS[i].q]));
  if (shuffle) order.sort(() => Math.random() - 0.5);
  pos = 0; flipped = false;
}

function el(tag, text, cls) {
  const n = document.createElement(tag);
  if (text !== undefined) n.textContent = text;
  if (cls) n.className = cls;
  return n;
}

function render() {
  const box = $("card");
  box.replaceChildren();
  if (!order.length) {
    box.append(el("div", "Nicio carte aici. Dacă ai activat „Doar ce nu știu”, le știi pe toate din acest set.", "text"));
    $("counter").textContent = "0 cărți";
  } else {
    const card = CARDS[order[pos]];
    box.className = "card" + (flipped ? " back" : "");
    box.append(el("div", card.c + (flipped ? " · răspuns" : " · întrebare"), "tag"), el("div", flipped ? card.a : card.q, "text"));
    $("counter").textContent = `Cartea ${pos + 1} din ${order.length}`;
  }
  const inDeck = CARDS.filter((c) => deck === "Toate" || c.c === deck);
  const got = inDeck.filter((c) => known[c.q]).length;
  $("progress").style.width = (inDeck.length ? (100 * got) / inDeck.length : 0) + "%";
  $("score").textContent = `Știute în „${deck}”: ${got} din ${inDeck.length}`;
  for (const b of $("decks").children) b.classList.toggle("on", b.dataset.deck === deck);
  $("onlyUnknown").classList.toggle("on", onlyUnknown);
}

function flip() { if (order.length) { flipped = !flipped; render(); } }
function move(step) { if (!order.length) return; pos = (pos + step + order.length) % order.length; flipped = false; render(); }
function mark(value) {
  if (!order.length) return;
  const q = CARDS[order[pos]].q;
  if (value) known[q] = true; else delete known[q];
  save();
  if (onlyUnknown && value) { buildOrder(false); render(); } else move(1);
}

for (const d of decks) {
  const b = el("button", d);
  b.type = "button"; b.dataset.deck = d;
  b.addEventListener("click", () => { deck = d; buildOrder(false); render(); });
  $("decks").append(b);
}
$("card").addEventListener("click", flip);
$("card").addEventListener("keydown", (e) => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); } });
$("ok").addEventListener("click", () => mark(true));
$("no").addEventListener("click", () => mark(false));
$("next").addEventListener("click", () => move(1));
$("prev").addEventListener("click", () => move(-1));
$("shuffle").addEventListener("click", () => { buildOrder(true); render(); });
$("onlyUnknown").addEventListener("click", () => { onlyUnknown = !onlyUnknown; buildOrder(false); render(); });
$("reset").addEventListener("click", () => { if (confirm("Ștergi tot progresul?")) { known = {}; save(); buildOrder(false); render(); } });
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "BUTTON" && e.key === " ") return;
  if (e.key === " ") { e.preventDefault(); flip(); }
  else if (e.key.toLowerCase() === "j") mark(true);
  else if (e.key.toLowerCase() === "n") mark(false);
  else if (e.key === "ArrowRight") move(1);
  else if (e.key === "ArrowLeft") move(-1);
});

buildOrder(true);
render();
</script>
</body>
</html>
