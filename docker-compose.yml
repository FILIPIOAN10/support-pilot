services:
  mongo:
    image: mongo:8
    ports:
      - "27018:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # the shop's order system (a stand-in, same image, other command)
  orders:
    build: .
    command: ["uvicorn", "supportpilot.orders_mock:app", "--host", "0.0.0.0", "--port", "9000"]
    ports:
      - "9000:9000"
    # the image's HEALTHCHECK asks port 8000; this service listens on 9000, so it needs its own
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9000/health/live', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  api:
    build: .
    ports:
      - "8001:8000"
    env_file:
      - path: .env
        required: false
    environment:
      MONGO_URL: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
      ORDERS_BASE_URL: http://orders:9000
      # project 1 (DocuAsk) runs from its own compose file on the host's port 8000
      DOCUASK_BASE_URL: http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      orders:
        condition: service_healthy

volumes:
  mongodata: